appId: com.lionlabs.lionclaw
productName: LionClaw
copyright: Copyright (c) 2026 LionLabs

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - '!dist/renderer/src/**'
  - node_modules/**/*
  - package.json
  - electron/main/archmap/core/grammars/**/*
  - electron/main/archmap/prompts/context/**/*.md

extraResources:
  - from: .lionclaw
    to: .lionclaw
    filter:
      - '**/*'
      - '!data/**'
  - from: resources/cursor-sidecar
    to: cursor-sidecar
    filter:
      - '**/*'
  - from: resources/cursor-sidecar/node_modules
    to: cursor-sidecar/node_modules
    filter:
      - '**/*'

mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
  signtoolOptions:
    publisherName: LionLabs

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false

asar: true

asarUnpack:
  - '**/@anthropic-ai/claude-agent-sdk-*/**'
  - '**/*.node'
  - '**/better-sqlite3/**'
  - '**/keytar/**'
  - '**/sqlite-vec/**'
  - '**/@cursor/sdk-*/**'
  - '**/electron/main/archmap/core/grammars/**'
  - '**/web-tree-sitter/web-tree-sitter.wasm'
  - 'dist/main/archmap-worker.js'
  - 'dist/main/chunks/**'

electronDownload:
  cache: .cache/electron
